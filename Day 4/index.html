<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block Elements</title>
    <link rel="stylesheet" href="style.css">   
</head>
<body>
    <p>This is a paragraph. It is a block-level element.</p>
    <a href="https://www.google.com">Google(Inline).</a>
    <div>This is a div. It is a block-level element.</div>
    <span>This is a span. It is an inline element.</span>
</body>
</html>
