<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>
    <style>
        .container{
            height: 80vh;
            width: 100vw;
            border: 2px solid black;
        }
        .box{
            height: 50px;
            width: 50px;
            border: 2px solid blue;
            background-color: red;
            transform: scale(1.5) rotate(45deg) skewY(20deg) translateX(100px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
