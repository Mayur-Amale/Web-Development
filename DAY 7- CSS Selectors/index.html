<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        .red {
            background-color: red;
        }
        #blue {
            background-color: blue;
        }
        div > p {
            background-color: yellow;
        }
        div p {
            background-color: green;
        }
        * {
            margin: 0;
            padding: 0;
        }
        a:visited {
            color: yellow;
        }
        a:hover {
            color: red;
        }
        a:active {
            color: green;
        }
        a:link {
            color: blue;
        }
    </style>
</head>
<body>
    <div class="red">This is a class selector.
        <p>This is a child selector.</p>
        <article>
            <p>This is a descendant selector.</p>
        </article>
    </div>
    <div id="blue">This is an id selector.</div>
    <a href="https://google.com/">This is a link selector.</a>
</body>
</html>
